[buildout]
parts = 

# Legacy-metadata repair wheels --------------------------------------------
# Two failure classes of 2019-era sdists are repaired by version-preserving
# wheels in local-wheels/ (see local-wheels/README.md for the rebuild
# procedure). The `+local1` label makes them sort above the PyPI artifacts
# for the resolver while still satisfying the release's `==X.Y` pins (PEP 440
# ignores local labels in public == matching), so no Plone pin is changed.
#
# 1) Products.CMFPlone 5.2.10/5.2.11 declare SVN-era requirement specifiers:
#        plone.app.contentmenu (>=1.1.6dev-r22380)
#        plone.app.layout      (>=1.1.7dev-r23744)
#    These predate PEP 440; strict parsers (uv, packaging >= 22) reject them,
#    aborting resolution of the whole tree. Old pkg_resources-based tooling
#    tolerated them via LegacyVersion. The repacks normalize those two lines
#    to bare names — exactly what upstream itself did in CMFPlone 5.2.12.
#
# 2) zope.container 4.5.0, BTrees 4.10.0, zope.security 5.3 (Zope 4.8.3 pins,
#    no cp39-arm64 wheels) pkg_resources.require()/setup_requires sibling
#    distributions AT BUILD TIME to locate C headers (persistent,
#    zope.proxy). uv's isolated build env only has setuptools+wheel, so the
#    lookup fails — or worse, fetches today's unbounded setup_requires (e.g.
#    persistent 6.x, whose cPersistence.h no longer defines PY3K, sending
#    zope.container's 2019 C down its dead py2 branch). Classic buildout
#    tolerated this via its shared eggs environment. The repacks are binary
#    wheels built in a venv with the PINNED build deps (persistent 4.9.0,
#    zope.proxy 4.5.0, zope.interface 5.4.0) — same versions, same C sources,
#    metadata untouched.
find-links = ${buildout:directory}/local-wheels

[instance]
recipe = plone.recipe.zope2instance
eggs = Plone
user = admin:admin
